name = "paulus-umbrella-ia"
main = "index.mjs"
compatibility_date = "2025-01-01"

# Gera resumo-app.mjs a partir de docs/umbrella-para-o-worker.md antes de publicar.
[build]
command = "node preparar.mjs"
watch_dir = "../docs"

[vars]
# Só o DOMÍNIO onde o Umbrella está publicado (sem caminho, sem barra no fim). Separe vários por vírgula.
# Ex.: "https://SEU-USUARIO.github.io"
ALLOWED_ORIGINS = "https://paulusxavier.github.io"
# ID do projeto Firebase (o mesmo "projectId" do firebase-config.js). Obrigatório: o Worker só atende quem estiver logado.
FIREBASE_PROJECT_ID = "paif-d2ab8"
# UIDs autorizados (separe por vírgula). Use os mesmos UIDs do firestore.rules (função dono()).
# ATENÇÃO: vazio = QUALQUER conta do projeto Firebase, e como a chave do firebase-config.js é pública,
# qualquer pessoa pode criar uma conta e gastar a sua cota da API da IA. Deixe sempre preenchido.
ALLOWED_UIDS = "yVnVPeyAIGdVxIIGzwljmZzR2tQ2"
# Teto de perguntas por usuário por dia (precisa do KV).
COTA_USUARIO_DIA = "100"
# Modelo do Claude. Haiku é o mais barato e responde bem a perguntas assim; troque por "claude-sonnet-5-5" se quiser mais capricho.
MODELO = "claude-haiku-5-5"
# Teto de perguntas por dia (só vale se você criar o KV abaixo).
COTA_DIA = "800"

# RECOMENDADO — cotas diárias (por usuário e total). Crie com:  npx wrangler kv namespace create LIMITES
# e cole o id abaixo, tirando o "#" das 3 linhas.
# [[kv_namespaces]]
# binding = "LIMITES"
# id = "COLE_O_ID_AQUI"
