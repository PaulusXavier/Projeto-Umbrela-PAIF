name = "paulus-umbrella-ia"
main = "index.mjs"
compatibility_date = "2025-01-01"

# Gera resumo-app.mjs a partir de docs/umbrella-para-o-worker.md antes de publicar.
[build]
command = "node preparar.mjs"
watch_dir = "../docs"

[vars]
# Só o DOMÍNIO onde o Umbrella está publicado (sem caminho, sem barra no fim). Separe vários por vírgula.
# Ex.: "https://SEU-USUARIO.github.io"
ALLOWED_ORIGINS = "https://SEU-USUARIO.github.io"
# Modelo do Claude. Haiku é o mais barato e responde bem a perguntas assim; troque por "claude-sonnet-5-5" se quiser mais capricho.
MODELO = "claude-haiku-5-5"
# Teto de perguntas por dia (só vale se você criar o KV abaixo).
COTA_DIA = "800"

# OPCIONAL — cota diária. Crie com:  npx wrangler kv namespace create LIMITES
# e cole o id abaixo, tirando o "#" das 3 linhas.
# [[kv_namespaces]]
# binding = "LIMITES"
# id = "COLE_O_ID_AQUI"
